name: Build Maigret

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Create build directory
        run: |
          mkdir -p build

      - name: Package Maigret
        run: |
          zip -r build/maigret-build.zip maigret-master \
            -x "maigret-master/.git/*"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: maigret-build
          path: build/maigret-build.zip
