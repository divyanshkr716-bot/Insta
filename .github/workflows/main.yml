name: Build Maigret

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<70" wheel

      - name: Install dependencies
        working-directory: maigret-master
        run: |
          pip install requests
          pip install requests-futures
          pip install beautifulsoup4
          pip install colorama
          pip install lxml
          pip install PySocks
          pip install soupsieve
          pip install stem
          pip install torrequest
          pip install aiohttp

      - name: Verify Maigret
        working-directory: maigret-master
        run: |
          python -m maigret --help

      - name: Create package
        run: |
          mkdir -p build
          zip -r build/maigret-build.zip maigret-master

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: maigret-build
          path: build/maigret-build.zip
